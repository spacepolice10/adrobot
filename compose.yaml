services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: adrobot
      POSTGRES_USER: adrobot
      POSTGRES_PASSWORD: adrobot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "adrobot", "-d", "adrobot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
