<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создание кампании</title>
</head>
<body>
  <main>
    <h1>Создание кампании</h1>
    <form>
      <p>
        <label for="campaign-name">Название кампании</label>
        <input id="campaign-name" name="name" type="text" required>
      </p>
      <p>
        <label for="country-code">Код страны</label>
        <input id="country-code" name="country_code" type="text"
               maxlength="2" pattern="[A-Za-z]{2}" placeholder="VN"
               aria-describedby="country-code-hint" required>
        <small id="country-code-hint">Две латинские буквы, например VN.</small>
      </p>
      <p>
        <label for="offer-id">ID оффера</label>
        <input id="offer-id" name="offer_id" type="number" min="1" step="1" required>
      </p>
      <p>
        <label for="domain-id">ID домена</label>
        <input id="domain-id" name="domain_id" type="number" min="1" step="1" required>
      </p>
      <p>
        <label for="group-id">ID группы</label>
        <input id="group-id" name="group_id" type="number" min="1" step="1" required>
      </p>
      <p>
        <label for="traffic-source-id">ID источника трафика</label>
        <input id="traffic-source-id" name="traffic_source_id" type="number"
               min="1" step="1" required>
      </p>
    </form>
  </main>
</body>
</html>
