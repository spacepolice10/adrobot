<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Adrobot</title>
  <link rel="stylesheet" href="/static/css/application.css?v=6">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
</head>
<body>
  <main x-data="{
    status: 'Select Check status to test the API and database.',
    checking: false,
    async check() {
      this.checking = true;
      this.status = 'Checking…';
      try {
        const response = await fetch('/api/health', { cache: 'no-store' });
        this.status = response.ok ? 'API and database are ready.' : 'Service unavailable.';
      } catch {
        this.status = 'Could not reach the service.';
      } finally {
        this.checking = false;
      }
    }
  }">
    <h1>Adrobot</h1>
    <button class="pressable" type="button" x-on:click="check()" x-bind:disabled="checking">Check status</button>
    <p role="status" x-text="status">The status check requires Alpine.js.</p>
    <a class="pressable" href="/campaigns">Кампании</a>
    <a class="pressable" href="/docs">API documentation</a>
  </main>
</body>
</html>
